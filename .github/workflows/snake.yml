name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Halloween contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFC247&color_dots=%23211A20,%2365330F,%23A94D0B,%23E87916,%23FFC247
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFC247&color_dots=%23211A20,%2365330F,%23A94D0B,%23E87916,%23FFC247

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
